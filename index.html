  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@300;400;500;600;700;800&display=swap');
  :root {
    /* Paleta oficial Dany Navarro · Longevidad & Bienestar Integral */
    --marfil:#F7F1E9;--papel:#FDFAF5;
    --cacao:#4A3B33;--cacao-suave:#6B5A50;
    --rosa:#8E4E52;--rosa-claro:#B87478;
    --velado:#E4D3CD;--velado-pale:#F0E3DE;

    /* Aliases para código existente */
    --forest:#4A3B33;--sage:#8E4E52;--sage-mid:#B87478;
    --sage-light:#E4D3CD;--sage-pale:#F0E3DE;--sage-ghost:#FDFAF5;
    --cream:#F7F1E9;--warm:#F0E3DE;--warm-deep:#E2D5C8;
    --terra:#8E4E52;--terra-glow:#B87478;--gold:#C2A878;
    --gold-pale:#F5EDD9;--rose:#8E4E52;--rose-pale:#F0E3DE;
    --text:#4A3B33;--text-soft:#6B5A50;--text-muted:#8A7365;
    --white:#FDFAF5;
    --shadow:0 2px 20px rgba(74,59,51,0.06);
    --shadow-lg:0 8px 32px rgba(74,59,51,0.10);
    /* Sistema MenteViva — niveles de activación cognitiva */
    --diff-verde:#7A9068;--diff-verde-bg:#EDF1E4;
    --diff-amarillo:#C2A878;--diff-amarillo-bg:#F5EDD9;
    --diff-naranja:#B87478;--diff-naranja-bg:#F0E3DE;
    --diff-rojo:#8E4E52;--diff-rojo-bg:#E4D3CD;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Manrope',-apple-system,sans-serif;background:var(--cream);color:var(--text);-webkit-font-smoothing:antialiased;}
  .app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--cream);overflow-x:hidden;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes timerShrink{from{width:100%}to{width:0%}}

  /* NAV */
  .nav{position:sticky;top:0;z-index:50;background:rgba(255,253,249,0.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--warm-deep);padding:0 20px;}
  .nav-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px;}
  .logo{font-family:'Fraunces',Georgia,serif;font-size:24px;color:var(--cacao);font-weight:500;letter-spacing:-0.01em;display:flex;align-items:center;line-height:1;}
  .logo span{color:var(--rosa);font-style:italic;font-weight:400;}
  .nav-right{display:flex;align-items:center;gap:8px;}
  .streak{display:flex;align-items:center;gap:4px;background:var(--gold-pale);border-radius:20px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--gold);}
  .pro-badge{background:linear-gradient(135deg,var(--terra),var(--terra-glow));color:white;font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px;letter-spacing:.5px;}

  /* BOTTOM TABS */
  .tabs{display:flex;background:var(--white);border-top:1px solid var(--warm-deep);position:sticky;bottom:0;z-index:50;box-shadow:0 -4px 24px rgba(61,90,74,0.08);}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px;border:none;background:transparent;font-family:'Manrope',-apple-system,sans-serif;font-size:12px;font-weight:700;color:var(--text-muted);cursor:pointer;transition:all .2s;gap:3px;}
  .tab .ti{font-size:20px;transition:transform .2s;}
  .tab.active{color:var(--terra);}
  .tab.active .ti{transform:scale(1.15);}

  .page{padding:0 0 90px;animation:fadeUp .28s ease;}
  .pad{padding:0 20px;}
  .sec-title{font-family:'Fraunces',Georgia,serif;font-size:19px;color:var(--forest);font-weight:600;margin-bottom:5px;}
  .sec-sub{font-size:15px;color:var(--text-soft);line-height:1.6;margin-bottom:14px;}
  .spacer{height:24px;}

  /* Niveles de activación cognitiva — Sistema MenteViva */
  .diff-dot{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .diff-verde{background:var(--diff-verde-bg);color:var(--diff-verde);}
  .diff-amarillo{background:var(--diff-amarillo-bg);color:var(--diff-amarillo);}
  .diff-naranja{background:var(--diff-naranja-bg);color:var(--diff-naranja);}
  .diff-rojo{background:var(--diff-rojo-bg);color:var(--diff-rojo);}

  /* HOME HERO */
  .hero{background:var(--warm);padding:28px 24px 30px;border-bottom:1px solid var(--warm-deep);position:relative;overflow:hidden;}
  .hero::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;border-radius:50%;background:rgba(201,107,58,.07);}
  .hero::after{content:'';position:absolute;bottom:-30px;right:20px;width:130px;height:130px;border-radius:50%;background:rgba(90,138,114,.06);}
  .hero-date{font-size:14px;color:var(--text-muted);margin-bottom:10px;text-transform:capitalize;}
  .hero-title{font-family:'Fraunces',Georgia,serif;font-size:30px;color:var(--cacao);line-height:1.2;margin-bottom:10px;font-weight:400;letter-spacing:-0.015em;}
  .hero-title em{font-style:italic;color:var(--rosa);font-weight:400;}
  .hero-sub{font-size:16px;color:var(--text-soft);line-height:1.7;margin-bottom:24px;max-width:290px;}
  .prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .prog-label{font-size:13px;color:var(--text-soft);font-weight:600;}
  .prog-frac{font-size:14px;font-weight:700;color:var(--forest);}
  .prog-bar{height:8px;background:var(--warm-deep);border-radius:8px;overflow:hidden;margin-bottom:22px;}
  .prog-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--sage),var(--terra));transition:width 1.2s cubic-bezier(.22,1,.36,1);}
  .stats-row{display:flex;background:var(--white);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);}
  .stat{flex:1;text-align:center;padding:16px 8px;}
  .stat+.stat{border-left:1px solid var(--warm);}
  .stat-n{font-family:'Fraunces',Georgia,serif;font-size:28px;color:var(--forest);font-weight:600;line-height:1;}
  .stat-l{font-size:13px;color:var(--text-muted);margin-top:3px;}

  /* TODAY CARDS */
  .today-list{padding:0 20px;margin-bottom:8px;}
  .today-card{display:flex;align-items:center;gap:14px;background:var(--white);border-radius:20px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:all .22s;border:2px solid transparent;position:relative;overflow:hidden;}
  .today-card:hover:not(.done):not(.locked){box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--sage-light);}
  .today-card.done{background:var(--sage-ghost);border-color:var(--sage-pale);}
  .today-card.locked{opacity:.55;cursor:default;}
  .tc-tag{position:absolute;top:0;right:0;background:linear-gradient(135deg,var(--gold),var(--terra-glow));font-size:11px;font-weight:700;color:white;padding:3px 10px 3px 8px;border-radius:0 20px 0 10px;letter-spacing:.4px;}
  .tc-icon{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
  .tc-info{flex:1;}
  .tc-name{font-size:17px;font-weight:700;color:var(--forest);margin-bottom:3px;}
  .tc-meta{font-size:14px;color:var(--text-muted);}
  .tc-btn{font-size:14px;font-weight:700;padding:8px 14px;border-radius:12px;white-space:nowrap;}
  .tc-btn.go{background:var(--warm);color:var(--terra);}
  .tc-btn.done{background:var(--sage-pale);color:var(--sage);}
  .tc-btn.lock{background:#f0f0f0;color:var(--text-muted);}

  /* DOMAINS GRID */
  .domains{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px;margin-bottom:28px;}
  .dom-card{background:var(--white);border-radius:18px;padding:18px;box-shadow:var(--shadow);}
  .dom-icon{font-size:22px;margin-bottom:8px;}
  .dom-name{font-size:13px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .dom-score{font-family:'Fraunces',Georgia,serif;font-size:34px;font-weight:600;line-height:1;margin:4px 0 10px;}
  .dom-bar{height:5px;border-radius:5px;background:var(--warm);overflow:hidden;}
  .dom-fill{height:100%;border-radius:5px;transition:width 1.4s cubic-bezier(.22,1,.36,1);}
  .dom-trend{font-size:13px;margin-top:7px;font-weight:700;}

  /* SCIENCE BANNER */
  .sci-banner{margin:8px 20px 28px;background:var(--forest);border-radius:22px;padding:22px;}
  .sci-banner-tag{font-size:13px;font-weight:700;color:#F2D08A;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:block;}
  .sci-banner-text{font-family:'Fraunces',Georgia,serif;font-size:18px;color:white;line-height:1.55;margin-bottom:8px;}
  .sci-banner-src{font-size:13px;color:rgba(255,255,255,.45);font-style:italic;}

  /* UPGRADE CARD */
  .upgrade{margin:0 20px 24px;background:var(--gold-pale);border:1.5px solid rgba(212,150,42,.25);border-radius:20px;padding:18px 20px;display:flex;align-items:center;gap:14px;}
  .uc-icon{font-size:30px;flex-shrink:0;}
  .uc-t{font-size:16px;font-weight:700;color:var(--forest);margin-bottom:3px;}
  .uc-s{font-size:14px;color:var(--text-soft);line-height:1.5;}
  .uc-btn{margin-left:auto;flex-shrink:0;padding:9px 14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--terra),var(--terra-glow));color:white;font-family:'Manrope',-apple-system,sans-serif;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;}

  /* LIBRARY (ENTRENA) */
  .train-hero{background:var(--warm);padding:28px 20px 22px;border-bottom:1px solid var(--warm-deep);}
  .train-t{font-family:'Fraunces',Georgia,serif;font-size:22px;color:var(--forest);margin-bottom:6px;font-weight:600;}
  .train-s{font-size:16px;color:var(--text-soft);line-height:1.65;}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 8px;}
  .filters::-webkit-scrollbar{display:none;}
  .fp{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--warm-deep);font-family:'Manrope',-apple-system,sans-serif;font-size:11px;font-weight:700;background:var(--white);color:var(--text-soft);cursor:pointer;transition:all .18s;}
  .fp.active{background:var(--forest);color:white;border-color:var(--forest);}
  .lib{padding:0 20px 8px;}
  .lib-card{background:var(--white);border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;transition:all .22s;border:2px solid transparent;}
  .lib-card:hover{border-color:var(--sage-light);box-shadow:var(--shadow-lg);transform:translateY(-1px);}
  .lib-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:10px;}
  .lib-info{flex:1;min-width:0;}
  .lib-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
  .lib-name{font-family:'Fraunces',Georgia,serif;font-size:17px;color:var(--forest);font-weight:600;margin-bottom:2px;}
  .lib-dom{font-size:14px;color:var(--text-muted);margin-bottom:8px;}
  .lib-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .ltag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;}
  .lib-badge-star{background:linear-gradient(135deg,var(--gold),var(--terra-glow));color:white;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap;margin-left:auto;align-self:flex-start;}
  .lib-badge-done{background:var(--sage-pale);color:var(--sage);font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap;margin-left:auto;align-self:flex-start;}
  .lib-badge-pro{background:var(--gold-pale);color:var(--gold);font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;border:1px solid rgba(212,150,42,.2);white-space:nowrap;margin-left:auto;align-self:flex-start;}
  .lib-desc{font-size:16px;color:var(--text-soft);line-height:1.72;margin-bottom:10px;}
  .lib-study{font-size:14px;color:var(--sage);font-style:italic;margin-bottom:14px;line-height:1.55;}
  .lib-hint{font-size:14px;color:var(--terra);font-weight:700;}
  .lib-cta{width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--sage),var(--forest));color:white;font-family:'Manrope',-apple-system,sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:6px;}
  .lib-cta:hover{opacity:.9;transform:translateY(-1px);}

  /* PROGRESS */
  .prog-hero{background:var(--warm);padding:28px 20px 24px;border-bottom:1px solid var(--warm-deep);}
  .prog-hero-title{font-family:'Fraunces',Georgia,serif;font-size:20px;color:var(--forest);margin-bottom:18px;font-weight:600;}
  .week{display:flex;justify-content:space-between;gap:6px;}
  .wday{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .wday-l{font-size:11px;color:var(--text-muted);font-weight:700;}
  .wday-wrap{height:64px;display:flex;align-items:flex-end;justify-content:center;width:100%;}
  .wday-bar{width:12px;border-radius:6px;transition:height .9s cubic-bezier(.22,1,.36,1);}
  .wday-sc{font-size:11px;font-weight:700;}
  .dom-rows{padding:20px 20px 8px;}
  .dom-row{background:var(--white);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;}
  .dr-icon{font-size:24px;width:44px;text-align:center;flex-shrink:0;}
  .dr-info{flex:1;}
  .dr-name{font-size:14px;font-weight:700;color:var(--forest);margin-bottom:7px;}
  .dr-bar{height:7px;background:var(--warm);border-radius:7px;overflow:hidden;flex:1;}
  .dr-fill{height:100%;border-radius:7px;transition:width 1.4s cubic-bezier(.22,1,.36,1);}
  .dr-score{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;min-width:40px;text-align:right;}
  .achieve{padding:0 20px 20px;}
  .ach-card{display:flex;align-items:center;gap:14px;background:var(--white);border-radius:16px;padding:16px;margin-bottom:8px;box-shadow:var(--shadow);}
  .ach-card.unlocked{border-left:3px solid var(--sage);}
  .ach-card.locked{opacity:.4;}
  .ach-icon{font-size:28px;width:44px;text-align:center;flex-shrink:0;}
  .ach-name{font-size:14px;font-weight:700;color:var(--forest);margin-bottom:2px;}
  .ach-desc{font-size:12px;color:var(--text-soft);}

  /* SCIENCE PAGE */
  .sci-page-hero{background:var(--warm);padding:28px 20px 24px;border-bottom:1px solid var(--warm-deep);}
  .sci-ey{font-size:11px;font-weight:700;color:var(--terra);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:block;}
  .sci-title{font-family:'Fraunces',Georgia,serif;font-size:22px;color:var(--forest);line-height:1.35;margin-bottom:10px;font-weight:600;}
  .sci-sub-text{font-size:14px;color:var(--text-soft);line-height:1.72;}
  .sci-stat{background:var(--white);border-radius:22px;padding:22px;margin:16px 20px 0;box-shadow:var(--shadow);}
  .ss-num{font-family:'Fraunces',Georgia,serif;font-size:44px;font-weight:600;line-height:1;margin-bottom:4px;}
  .ss-lbl{font-size:13px;font-weight:700;color:var(--forest);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
  .ss-desc{font-size:14px;color:var(--text-soft);line-height:1.72;}
  .ss-src{font-size:11px;color:var(--sage);font-style:italic;margin-top:10px;}
  .sci-fem{margin:16px 20px 0;background:var(--rose-pale);border-radius:22px;padding:20px;border-left:4px solid var(--rose);}
  .sf-title{font-size:15px;font-weight:700;color:var(--rose);margin-bottom:10px;}
  .sf-desc{font-size:14px;color:var(--text-soft);line-height:1.72;}
  .sci-pillars{padding:8px 20px 20px;}
  .spi{background:var(--white);border-radius:18px;padding:18px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:14px;}
  .spi-icon{font-size:24px;flex-shrink:0;margin-top:1px;}
  .spi-title{font-size:14px;font-weight:700;color:var(--forest);margin-bottom:4px;}
  .spi-desc{font-size:13px;color:var(--text-soft);line-height:1.65;}
  .spi-study{font-size:11px;color:var(--sage);font-style:italic;margin-top:5px;}

  /* EXERCISE SCREEN */
  .ex-screen{position:fixed;inset:0;z-index:200;background:var(--cream);display:flex;flex-direction:column;max-width:430px;margin:0 auto;animation:slideUp .38s cubic-bezier(.22,1,.36,1);overflow:hidden;}
  .ex-hdr{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--warm-deep);background:var(--white);}
  .ex-back{width:42px;height:42px;border-radius:50%;border:none;background:var(--warm);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--forest);font-weight:700;}
  .ex-hdr-info{flex:1;}
  .ex-hdr-name{font-family:'Fraunces',Georgia,serif;font-size:18px;color:var(--forest);font-weight:600;}
  .ex-hdr-dom{font-size:14px;color:var(--text-muted);}
  .ex-timer-chip{display:flex;align-items:center;gap:5px;background:var(--sage-pale);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:700;color:var(--sage);}
  .ex-body{flex:1;overflow-y:auto;padding:20px;background:var(--cream);}
  .ex-sci{background:var(--sage-ghost);border-radius:16px;padding:16px;border-left:3px solid var(--sage-mid);margin-bottom:18px;}
  .ex-sci-ey{font-size:13px;font-weight:700;color:var(--sage);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .ex-sci-tr{font-size:14px;color:var(--forest);font-weight:600;margin-bottom:4px;}
  .ex-sci-st{font-size:14px;color:var(--text-soft);font-style:italic;line-height:1.55;}
  .ex-start{background:var(--white);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:16px;}
  .ex-start-t{font-size:15px;font-weight:700;color:var(--forest);margin-bottom:8px;}
  .ex-start-d{font-size:14px;color:var(--text-soft);line-height:1.72;margin-bottom:16px;}
  .diff-selector{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .dpill{padding:10px 16px;border-radius:20px;border:2px solid var(--warm-deep);font-family:'Manrope',-apple-system,sans-serif;font-size:15px;font-weight:700;background:transparent;color:var(--text-soft);cursor:pointer;transition:all .16s;display:flex;align-items:center;gap:5px;}
  .dpill.active-verde{background:var(--diff-verde-bg);color:var(--diff-verde);border-color:var(--diff-verde);}
  .dpill.active-amarillo{background:var(--diff-amarillo-bg);color:var(--diff-amarillo);border-color:var(--diff-amarillo);}
  .dpill.active-naranja{background:var(--diff-naranja-bg);color:var(--diff-naranja);border-color:var(--diff-naranja);}
  .dpill.active-rojo{background:var(--diff-rojo-bg);color:var(--diff-rojo);border-color:var(--diff-rojo);}
  .ex-cta{width:100%;padding:17px;border-radius:18px;border:none;background:linear-gradient(135deg,var(--sage),var(--forest));color:white;font-family:'Manrope',-apple-system,sans-serif;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(61,90,74,.2);transition:all .2s;}
  .ex-cta:hover{transform:translateY(-2px);}
  .game-box{background:var(--white);border-radius:22px;padding:24px;box-shadow:var(--shadow);text-align:center;margin-bottom:16px;}
  .game-inst{font-size:17px;color:var(--text-soft);margin-bottom:20px;line-height:1.65;}
  .gp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--text-soft);font-weight:600;}
  .gp-bar{height:5px;background:var(--warm);border-radius:5px;overflow:hidden;margin-bottom:18px;}
  .gp-fill{height:100%;background:linear-gradient(90deg,var(--sage),var(--terra));border-radius:5px;transition:width .4s ease;}

  /* TIMER BAR (red-draining) */
  .timer-bar{height:5px;background:var(--warm);border-radius:5px;overflow:hidden;margin-bottom:16px;}
  .timer-fill{height:100%;background:linear-gradient(90deg,#2E9C4A,#C43A3A);border-radius:5px;transition:width .1s linear;}

  /* ── GAME-SPECIFIC STYLES ── */

  /* VELOCIDAD VISUAL (grid) */
  .vel-target{font-size:40px;margin:8px 0 16px;animation:pulse .6s ease infinite;}
  .vel-grid{display:grid;gap:8px;margin:0 auto;max-width:300px;}
  .vel-cell{aspect-ratio:1;border-radius:12px;border:none;font-size:26px;background:var(--warm);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(61,90,74,.07);}
  .vel-cell:hover{transform:scale(1.08);border:2px solid var(--sage-light);}
  .vel-cell.correct{background:var(--sage-pale);animation:pulse .3s ease;}
  .vel-cell.wrong{background:#FFE8E0;animation:shake .3s;}

  /* MEMORIA VISUAL */
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:290px;margin:0 auto;}
  .mem-card{aspect-ratio:1;border-radius:12px;border:none;cursor:pointer;font-size:24px;transition:all .22s;background:var(--warm);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(61,90,74,.07);}
  .mem-card.flipped{background:var(--sage);}
  .mem-card.matched{background:var(--sage-pale);border:2px solid var(--sage-light);}
  .mem-card.wrong{background:#FFE8E0;animation:shake .3s;}

  /* STROOP */
  .stroop-w{font-family:'Fraunces',Georgia,serif;font-size:52px;font-weight:600;margin:14px 0;display:inline-block;border-radius:12px;padding:8px 22px;transition:outline .2s;}
  .stroop-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .stroop-btn{padding:14px;border-radius:15px;border:none;font-family:'Manrope',-apple-system,sans-serif;font-size:14px;font-weight:700;color:white;cursor:pointer;transition:all .15s;}
  .stroop-btn:active{transform:scale(.94);}

  /* VERBAL */
  .verbal-letter{font-family:'Fraunces',Georgia,serif;font-size:72px;color:var(--forest);font-weight:600;margin:8px 0 4px;}
  .verbal-hint{font-size:14px;color:var(--text-soft);margin-bottom:18px;}
  .verbal-inp{width:100%;padding:14px 18px;border-radius:14px;border:2px solid var(--warm-deep);background:var(--cream);font-family:'Manrope',-apple-system,sans-serif;font-size:17px;color:var(--text);outline:none;transition:border-color .18s;}
  .verbal-inp:focus{border-color:var(--sage);}
  .verbal-add{margin-top:8px;padding:11px 24px;background:var(--sage);color:white;border:none;border-radius:12px;font-family:'Manrope',-apple-system,sans-serif;font-size:14px;font-weight:700;cursor:pointer;}
  .verbal-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .vtag{background:var(--sage-pale);color:var(--sage);border-radius:20px;padding:5px 13px;font-size:13px;font-weight:700;}

  /* SPAN NUMÉRICO */
  .seq-display{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
  .seq-n{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--forest);background:var(--warm);transition:all .28s;}
  .seq-n.hl{background:var(--sage);color:white;transform:scale(1.1);box-shadow:0 4px 16px rgba(90,138,114,.4);}
  .seq-keys{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
  .seq-k{width:54px;height:54px;border-radius:14px;border:2px solid var(--warm-deep);background:var(--white);font-family:'Manrope',-apple-system,sans-serif;font-size:19px;font-weight:700;color:var(--forest);cursor:pointer;transition:all .14s;box-shadow:var(--shadow);}
  .seq-k:hover{border-color:var(--sage-light);}
  .seq-k:active{transform:scale(.92);}

  /* COGNICIÓN SOCIAL */
  .social-scenario{font-family:'Fraunces',Georgia,serif;font-size:18px;color:var(--forest);line-height:1.5;margin:8px 0 20px;font-style:italic;background:var(--warm);border-radius:14px;padding:16px;}
  .social-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .social-opt{padding:14px 10px;border-radius:16px;border:2px solid var(--warm-deep);background:var(--white);cursor:pointer;transition:all .2s;text-align:center;}
  .social-opt:hover{border-color:var(--sage-light);}
  .social-opt.correct{border-color:var(--sage);background:var(--sage-pale);}
  .social-opt.wrong{border-color:var(--terra);background:#FFE8E0;animation:shake .3s;}
  .social-face{font-size:36px;margin-bottom:6px;}
  .social-label{font-size:16px;font-weight:700;color:var(--forest);}

  /* ANAGRAMAS */
  .ana-word{font-family:'Fraunces',Georgia,serif;font-size:36px;color:var(--forest);font-weight:600;letter-spacing:8px;margin:10px 0 8px;}
  .ana-hint{font-size:13px;color:var(--text-muted);margin-bottom:16px;}
  .ana-inp{width:100%;padding:14px 18px;border-radius:14px;border:2px solid var(--warm-deep);background:var(--cream);font-family:'Fraunces',Georgia,serif;font-size:22px;color:var(--forest);outline:none;transition:border-color .18s;text-transform:uppercase;letter-spacing:4px;text-align:center;}
  .ana-inp:focus{border-color:var(--sage);}
  .ana-btn{margin-top:10px;padding:13px 28px;background:var(--sage);color:white;border:none;border-radius:14px;font-family:'Manrope',-apple-system,sans-serif;font-size:15px;font-weight:700;cursor:pointer;}
  .ana-letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0;}
  .ana-letter{width:42px;height:42px;border-radius:10px;background:var(--warm);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;color:var(--forest);}

  /* BÚSQUEDA VISUAL */
  .busq-target-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;}
  .busq-target-label{font-size:13px;color:var(--text-soft);font-weight:600;}
  .busq-target-item{font-size:40px;animation:pulse .8s ease infinite;}
  .busq-grid{display:grid;gap:6px;margin:0 auto;}
  .busq-cell{aspect-ratio:1;border-radius:10px;border:none;font-size:24px;background:var(--warm);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
  .busq-cell.found{background:var(--sage-pale);border:2px solid var(--sage);transform:scale(.94);}
  .busq-cell.wrong-tap{animation:shake .25s;}

  /* RAZONAMIENTO */
  .razon-seq{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 20px;}
  .razon-n{width:52px;height:52px;border-radius:12px;background:var(--warm);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;color:var(--forest);}
  .razon-n.blank{background:linear-gradient(135deg,var(--sage-pale),var(--sage-ghost));border:2px dashed var(--sage-mid);}
  .razon-inp{width:100%;padding:14px;border-radius:14px;border:2px solid var(--warm-deep);background:var(--cream);font-family:'Fraunces',Georgia,serif;font-size:24px;color:var(--forest);outline:none;transition:border-color .18s;text-align:center;}
  .razon-inp:focus{border-color:var(--sage);}
  .razon-btn{margin-top:10px;padding:13px 32px;background:var(--sage);color:white;border:none;border-radius:14px;font-family:'Manrope',-apple-system,sans-serif;font-size:15px;font-weight:700;cursor:pointer;}

  /* BREATHING */
  .breath-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:10px 0 20px;}
  .breath-ring{width:170px;height:170px;border-radius:50%;border:4px solid var(--sage-pale);display:flex;align-items:center;justify-content:center;transition:transform 1s ease,box-shadow 1s ease;}
  .breath-ring.expand{transform:scale(1.22);box-shadow:0 0 50px rgba(90,138,114,.18);border-color:var(--sage-mid);}
  .breath-ring.hold{transform:scale(1.22);box-shadow:0 0 50px rgba(90,138,114,.28);}
  .breath-inner{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--sage-ghost),var(--sage-pale));display:flex;align-items:center;justify-content:center;flex-direction:column;transition:all 1s ease;}
  .breath-ring.expand .breath-inner{background:linear-gradient(135deg,var(--sage-pale),var(--sage-light));}
  .breath-ph{font-family:'Fraunces',Georgia,serif;font-size:17px;color:var(--forest);font-weight:600;}
  .breath-ct{font-size:30px;font-weight:700;color:var(--sage);font-family:'Fraunces',Georgia,serif;}
  .breath-inst{font-size:14px;color:var(--text-soft);font-style:italic;text-align:center;}

  /* RESULT + FEEDBACK */
  .result-score-card{background:linear-gradient(150deg,var(--forest),var(--sage));border-radius:24px;padding:28px 24px;text-align:center;margin-bottom:16px;color:white;}
  .rc-emoji{font-size:52px;margin-bottom:10px;}
  .rc-title{font-family:'Fraunces',Georgia,serif;font-size:22px;margin-bottom:6px;}
  .rc-sub{font-size:15px;color:rgba(255,255,255,.65);margin-bottom:20px;}
  .rc-score{font-family:'Fraunces',Georgia,serif;font-size:72px;line-height:1;font-weight:600;}
  .rc-score-lbl{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;}
  .rc-meta{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:rgba(255,255,255,.1);border-radius:20px;padding:6px 14px;font-size:14px;color:rgba(255,255,255,.8);}
  .feedback-card{background:var(--white);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:2px solid var(--sage-pale);}
  .fb-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .fb-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--sage),var(--forest));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .fb-name{font-size:15px;font-weight:700;color:var(--forest);}
  .fb-role{font-size:13px;color:var(--text-muted);}
  .fb-pro{margin-left:auto;font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--terra-glow));color:white;padding:3px 9px;border-radius:8px;}
